# Cloud-wide What's New and main AWS Blogs. IAM- and security-flavoured items are owned by dedicated tracks.

keywords:
  primary:
    - general-availability
    - generally-available
    - launches
    - now-available
    - preview
    - region
  secondary:
    - new
    - support
    - feature
    - service
    - integration
    - sdk
    - cli

source_weights:
  default: 1.0
  rss:aws-whats-new: 1.5
  rss:aws-news-blog: 1.3

rss:
  - id: aws-whats-new
    url: https://aws.amazon.com/about-aws/whats-new/recent/feed/
  - id: aws-news-blog
    url: https://aws.amazon.com/blogs/aws/feed/
  - id: aws-compute-blog
    url: https://aws.amazon.com/blogs/compute/feed/
  - id: aws-containers-blog
    url: https://aws.amazon.com/blogs/containers/feed/
  - id: aws-architecture-blog
    url: https://aws.amazon.com/blogs/architecture/feed/

github: []
